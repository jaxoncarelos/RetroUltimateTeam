name: iOS build (unsigned IPA for Sideloadly)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$B/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -sSL -o templates.tpz "$B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q templates.tpz -d tpl
          cp -R tpl/templates/. "$T/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Stamp build id and OTA update config
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          {
            echo 'class_name BuildInfo'
            echo 'extends RefCounted'
            echo "const ID := \"${GITHUB_SHA::7}\""
            echo "const REPO := \"${GITHUB_REPOSITORY}\""
            echo "const TOKEN := \"${UPDATE_TOKEN}\""
          } > scripts/build_info.gd
          if [ -z "${UPDATE_TOKEN}" ]; then
            echo "::warning title=Auto-updates OFF::Repo secret UPDATE_TOKEN is not set, so this build cannot download updates. Add a fine-grained read-only (Contents) token for this repo as the UPDATE_TOKEN secret."
            echo "OTA_STATUS=OFF (UPDATE_TOKEN secret missing)" >> "$GITHUB_ENV"
          else
            echo "OTA_STATUS=ON" >> "$GITHUB_ENV"
          fi
          # Base build lives in project.godot: a runtime pack can't override it, so the game can tell
          # that an update pack belongs to an older IPA.
          sed -i '' "s/^base_build=.*/base_build=\"${GITHUB_SHA::7}\"/" project.godot
          grep -n "base_build\|engine_epoch" project.godot
          echo "EPOCH=$(sed -n 's/^engine_epoch=//p' project.godot)" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          "$GODOT" --headless --path . --import || true

      - name: Export Xcode project
        run: |
          mkdir -p export/ios
          "$GODOT" --headless --path . --export-release iOS export/ios/PocketGridiron.ipa
          ls -R export/ios | head -50

      - name: Export OTA update pack
        run: |
          "$GODOT" --headless --path . --export-pack iOS "update-e${EPOCH}-${GITHUB_SHA::7}.pck"
          ls -l update-*.pck

      - name: Build unsigned app
        run: |
          xcodebuild -project export/ios/PocketGridiron.xcodeproj -scheme PocketGridiron \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry PocketGridiron.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGridiron-ipa
          path: PocketGridiron.ipa

      # Rolling "latest" release so the IPA has a stable download URL from any device.
      - name: Publish to the "latest" GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PocketGridiron.ipa update-e*.pck \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Unsigned IPA built from ${GITHUB_SHA} on $(date -u +%F). Open in AltStore/Sideloadly to install. Auto-updates: ${OTA_STATUS:-unknown}." \
            --target "$GITHUB_SHA"
